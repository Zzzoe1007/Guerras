      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="558" height="298" rx="4" fill="url(#fondo)" stroke="#c8ccd1" stroke-width="1.5"/>
  <rect x="12" y="12" width="536" height="276" rx="2" fill="none" stroke="#d9d4c6" stroke-width="1"/>
  <ellipse cx="280" cy="150" rx="250" ry="125" fill="url(#halo)"/>

