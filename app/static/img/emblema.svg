      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#efece3"/>
    </linearGradient>
    <linearGradient id="globo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b86c4"/>
      <stop offset="1" stop-color="#24486f"/>
